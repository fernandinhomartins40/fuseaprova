# =============================================================================
# nginx interno do Fuse Aprova (container `nginx` do compose, imagem web)
#
# Fica atrás do nginx do HOST (que termina o TLS de www.fuseaprova.com.br e
# faz proxy para 127.0.0.1:3600 -> este container, porta 8080).
#
# - Serve o build estático da PWA (/usr/share/nginx/html, de apps/web/dist).
# - Encaminha /api/* para api:3000 SEM remover o prefixo (a API usa /api).
# - Mesmos cabeçalhos de segurança/CSP do antigo Caddyfile: só 'self',
#   img-src aceita data: (QR Code Pix em base64), sem CDN, sem fonte externa.
# - Sem log de acesso: as URLs de /recuperar/:token não vão para log.
#
# Copiado para /etc/nginx/conf.d/default.conf pela infra/docker/web.Dockerfile.
# O build da imagem roda `nginx -t` com este arquivo.
# =============================================================================

# IP real do aluno: o nginx do host sobrescreve X-Real-IP com o $remote_addr
# dele. Só confiamos nesse cabeçalho quando a conexão vem do host (rede do
# Docker ou loopback); vindo de qualquer outro lugar ele é ignorado.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;
real_ip_recursive off;

# Protocolo original (o host fala HTTPS com o aluno e HTTP com este container).
map $http_x_forwarded_proto $fuse_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Upgrade de conexão (websocket), caso algum dia a API use.
map $http_upgrade $fuse_connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;
    charset utf-8;

    # Upload de imagem do admin (2 MB na API) e corpo JSON (2 MB). Folga para
    # o multipart; a API continua sendo quem limita de verdade.
    client_max_body_size 10m;

    # O DNS interno do Docker. Com `set $upstream` + resolver, o nginx resolve
    # `api` a cada 10 s: quando o deploy recria o container da API (IP novo),
    # o proxy acompanha sem reiniciar o nginx, e o nginx sobe mesmo com a API
    # ainda fora do ar (o `nginx -t` do build também não precisa dela).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Compressão gzip (os assets do Vite não vêm pré-comprimidos).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml text/xml application/xml;

    # Cabeçalhos de segurança: um include em cada location, porque um
    # add_header dentro da location apaga os herdados do server.
    include /etc/nginx/fuseaprova/seguranca.conf;

    # Saúde do próprio nginx (healthcheck do compose). Não toca a API.
    location = /nginx-saude {
        include /etc/nginx/fuseaprova/seguranca.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API ---------------------------------------------------------------
    location /api/ {
        include /etc/nginx/fuseaprova/seguranca.conf;
        set $fuse_api http://api:3000;
        # Sem URI no proxy_pass (variável): repassa o caminho original, com /api.
        proxy_pass $fuse_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fuse_connection_upgrade;
        # Sobrescreve (não acrescenta) o X-Forwarded-For: a API usa
        # trustProxy e lê o primeiro IP da lista. Assim o aluno não consegue
        # forjar o IP do rate limit mandando o próprio X-Forwarded-For.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fuse_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # Os cabeçalhos de segurança são os deste arquivo, não os do helmet.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header X-Powered-By;
    }
    location = /api {
        return 301 /api/;
    }

    # ---- Assets com hash (Vite: /assets/*-[hash].ext) -----------------------
    # Cache de 1 ano, imutável. Sem fallback SPA: arquivo que não existe
    # responde 404 (e não um index.html cacheado para sempre).
    location /assets/ {
        include /etc/nginx/fuseaprova/seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- Arquivos que precisam chegar novos a cada deploy -------------------
    # no-cache = o navegador sempre revalida (ETag/Last-Modified -> 304).
    location = /index.html {
        include /etc/nginx/fuseaprova/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /sw.js {
        include /etc/nginx/fuseaprova/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /registerSW.js {
        include /etc/nginx/fuseaprova/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/fuseaprova/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # Arquivos ocultos (.algo) nunca são servidos.
    location ~ /\. {
        return 404;
    }

    # ---- Resto: ícones, workbox-*.js e fallback SPA -------------------------
    # Rota desconhecida (/aprender, /licao/123...) -> index.html.
    location / {
        include /etc/nginx/fuseaprova/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
