<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuse Aprova · Lição · pergunta</title>
<style>
@font-face{font-family:'Nunito';font-weight:600;font-display:swap;src:url('fonts/nunito-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Nunito';font-weight:700;font-display:swap;src:url('fonts/nunito-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Nunito';font-weight:800;font-display:swap;src:url('fonts/nunito-latin-800-normal.woff2') format('woff2')}
@font-face{font-family:'Nunito';font-weight:900;font-display:swap;src:url('fonts/nunito-latin-900-normal.woff2') format('woff2')}
@font-face{font-family:'Baloo 2';font-weight:600;font-display:swap;src:url('fonts/baloo-2-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Baloo 2';font-weight:700;font-display:swap;src:url('fonts/baloo-2-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Baloo 2';font-weight:800;font-display:swap;src:url('fonts/baloo-2-latin-800-normal.woff2') format('woff2')}
html{background:#E9EBEF}body{margin:0;min-height:100vh;display:grid;place-items:center}
body>div{box-shadow:0 10px 40px rgba(0,0,0,.18);border-radius:28px}

body{margin:0}
.op{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;box-sizing:border-box;padding:9px 12px;border:2px solid #E5E7EB;border-radius:16px;background:#FFFFFF;box-shadow:0 4px 0 #E5E7EB;font-family:'Nunito';font-weight:700;font-size:15px;line-height:1.3;color:#2D2F36;text-align:left}
.op .k{width:30px;height:30px;flex:none;border:2px solid #E5E7EB;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:14px;color:#6B7079}
.op.sel{border-color:#7DB4FF;background:#EAF3FF;box-shadow:0 4px 0 #7DB4FF;color:#1550A8}
.op.sel .k{border-color:#7DB4FF;color:#1D6FE0}

</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Nunito', system-ui, sans-serif; color: #2D2F36; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 60px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px">
    <a href="04-Trilha.html" aria-label="Sair da lição" style="width: 36px; height: 36px; display: grid; place-items: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9AA0AA" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div role="progressbar" aria-label="Progresso da lição" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" style="flex: 1; height: 16px; border-radius: 8px; background: #E5E7EB; overflow: hidden">
      <div style="width: 40%; height: 100%; background: #15803D; border-radius: 8px; position: relative"><span style="position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.35)"></span></div>
    </div>
    <div aria-label="5 vidas" style="display: flex; align-items: center; gap: 4px; font-weight: 900; font-size: 16px; color: #DC2626">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.2-4.6-9.6-9.2A5.6 5.6 0 0 1 12 5.9a5.6 5.6 0 0 1 9.6 5.9C19.2 16.4 12 21 12 21z" fill="#F0484D"/></svg>5
    </div>
  </header>

  <main style="flex: 1; padding: 4px 18px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="display: inline-flex; align-items: center; gap: 5px; background: #F3EEFF; color: #6D3FE0; font-size: 12px; font-weight: 900; letter-spacing: .04em; padding: 4px 9px; border-radius: 8px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6D3FE0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>FAU-Unicentro · [Órgão] · [Ano]
      </span>
      <span style="font-size: 12px; font-weight: 800; color: #6B7079">Português</span>
    </div>

    <h1 style="margin: 0; font-family: 'Baloo 2'; font-weight: 700; font-size: 23px; line-height: 1.15">Selecione a alternativa correta</h1>

    <div style="display: flex; align-items: flex-start; gap: 8px">
      <svg width="72" height="66" viewBox="0 0 120 110" aria-hidden="true" style="flex: none; margin-top: 8px">
        <ellipse cx="60" cy="80" rx="44" ry="26" fill="#A86B3C"/>
        <rect x="22" y="18" width="76" height="62" rx="30" fill="#BC7E4A"/>
        <ellipse cx="34" cy="22" rx="8" ry="7" fill="#8E5631"/><ellipse cx="86" cy="22" rx="8" ry="7" fill="#8E5631"/>
        <rect x="36" y="48" width="48" height="30" rx="15" fill="#946038"/>
        <ellipse cx="52" cy="58" rx="3" ry="2.3" fill="#3A2416"/><ellipse cx="68" cy="58" rx="3" ry="2.3" fill="#3A2416"/>
        <path d="M54 69h12" stroke="#3A2416" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="44" cy="40" r="5.6" fill="#1F1A17"/><circle cx="76" cy="40" r="5.6" fill="#1F1A17"/>
        <circle cx="46" cy="38" r="1.9" fill="#FFFFFF"/><circle cx="78" cy="38" r="1.9" fill="#FFFFFF"/>
        <path d="M36 30l14 3M84 30l-14 3" stroke="#6E4325" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M24 78q36 16 72 0l-2 9q-34 15-68 0z" fill="#D9480F"/>
      </svg>
      <div style="flex: 1; border: 2px solid #E5E7EB; border-radius: 16px; padding: 11px 13px; font-size: 16px; font-weight: 800; line-height: 1.4; position: relative">
        <span aria-hidden="true" style="position: absolute; left: -8px; top: 26px; width: 12px; height: 12px; background: #FFFFFF; border-left: 2px solid #E5E7EB; border-bottom: 2px solid #E5E7EB; transform: rotate(45deg)"></span>
        Assinale a alternativa em que o uso do acento grave (crase) está correto.
      </div>
    </div>

    <div role="radiogroup" aria-label="Alternativas" style="display: flex; flex-direction: column; gap: 9px">
      <button class="op" role="radio" aria-checked="false"><span class="k">A</span>Fomos à Curitiba no feriado.</button>
      <button class="op" role="radio" aria-checked="false"><span class="k">B</span>Entregue o documento à ela.</button>
      <button class="op sel" role="radio" aria-checked="true"><span class="k">C</span>O candidato chegou à prefeitura às 8 horas.</button>
      <button class="op" role="radio" aria-checked="false"><span class="k">D</span>Comprei uma bicicleta à prazo.</button>
      <button class="op" role="radio" aria-checked="false"><span class="k">E</span>Começou à chover no fim da prova.</button>
    </div>
  </main>

  <footer style="flex: none; padding: 14px 18px 28px; border-top: 2px solid #EEF0F3; display: flex; gap: 12px">
    <button aria-label="Ver dica (custa 5 gemas)" style="height: 54px; padding: 0 16px; border-radius: 16px; border: 2px solid #E5E7EB; background: #FFFFFF; box-shadow: 0 4px 0 #E5E7EB; font-family: 'Nunito'; font-weight: 900; font-size: 15px; letter-spacing: .04em; color: #B7791F; display: flex; align-items: center; gap: 6px">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.7.5 1.1 1.3 1.1 2.1V17h5.4v-.6c0-.8.4-1.6 1.1-2.1A6.5 6.5 0 0 0 12 2.5z" fill="#FFC233"/><rect x="9.3" y="18.2" width="5.4" height="2" rx="1" fill="#9AA0AA"/><rect x="10.2" y="21" width="3.6" height="1.6" rx=".8" fill="#9AA0AA"/></svg>DICA
    </button>
    <a href="06-Acerto.html" style="flex: 1; height: 54px; border-radius: 16px; background: #15803D; box-shadow: 0 5px 0 #0F5F2D; color: #FFFFFF; font-weight: 900; font-size: 16px; letter-spacing: .06em; display: grid; place-items: center; text-decoration: none">VERIFICAR</a>
  </footer>
</div>
</body>
</html>
