<style>

html{background:#E9EBEF}body{margin:0;min-height:100vh;display:grid;place-items:center}

body{margin:0}
.dia{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:900;color:#6B7079}

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Nunito', system-ui, sans-serif; color: #2D2F36; display: flex; flex-direction: column; overflow: hidden; padding: 0 22px 28px">

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center">
    <div style="position: relative; width: 200px; height: 220px">
      <svg width="200" height="220" viewBox="0 0 24 26" role="img" aria-label="Chama da ofensiva">
        <path d="M12 1c1.5 5 7.5 6.7 7.5 13.2a7.5 7.5 0 0 1-15 0C4.5 11 6 9.3 7.6 8c0 2.8 1.3 4.4 2.9 4.4C10.5 7 8.9 4.6 12 1z" fill="#FF7A1A"/>
        <path d="M12 11c.9 2.5 3.9 3.3 3.9 6.4a3.9 3.9 0 0 1-7.8 0c0-1.9 1.3-2.8 2.2-3.3 0 1.4.7 2.2 1.4 2.2.1-2.2-.6-3.4.3-5.3z" fill="#FFC233"/>
      </svg>
      <span style="position: absolute; left: 0; right: 0; bottom: 18px; font-family: 'Baloo 2'; font-weight: 800; font-size: 64px; line-height: 1; color: #FFFFFF; text-shadow: 0 4px 0 #C2410C">8</span>
    </div>
    <h1 style="margin: 0; font-family: 'Baloo 2'; font-weight: 800; font-size: 34px; line-height: 1.05; color: #C2410C">dias de ofensiva!</h1>
    <p style="margin: 0; font-size: 16px; font-weight: 700; color: #6B7079; max-width: 290px; line-height: 1.45">Seu maior recorde até agora. Estude amanhã para manter a chama acesa.</p>

    <section aria-label="Semana" style="width: 100%; box-sizing: border-box; margin-top: 16px; border: 2px solid #E5E7EB; border-radius: 20px; padding: 16px 14px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between">
        <div class="dia">S<span class="bol" style="background: #FF7A1A"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#FFFFFF" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
        <div class="dia">T<span class="bol" style="background: #FF7A1A"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#FFFFFF" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
        <div class="dia">Q<span class="bol" style="background: #FF7A1A"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#FFFFFF" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
        <div class="dia">Q<span class="bol" style="background: #FF7A1A"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#FFFFFF" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
        <div class="dia" style="color: #C2410C">S<span class="bol" style="background: #FF7A1A; box-shadow: 0 0 0 4px #FFE1CC"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#FFFFFF" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
        <div class="dia">S<span class="bol" style="background: #E5E7EB"></span></div>
        <div class="dia">D<span class="bol" style="background: #E5E7EB"></span></div>
      </div>
      <div style="height: 2px; background: #EEF0F3"></div>
      <div style="display: flex; align-items: center; gap: 12px; text-align: left">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="#15803D"/></svg>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 15px; font-weight: 900">Meta diária: 2 de 2 lições</span>
          <div style="height: 12px; border-radius: 6px; background: #15803D"></div>
        </div>
      </div>
    </section>
  </div>

  <a href="04-Trilha.html" style="height: 54px; border-radius: 16px; background: #15803D; box-shadow: 0 5px 0 #0F5F2D; color: #FFFFFF; font-weight: 900; font-size: 16px; letter-spacing: .06em; display: grid; place-items: center; text-decoration: none">CONTINUAR</a>
