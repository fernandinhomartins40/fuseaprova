# =============================================================================
# App Android (Capacitor): gera o AAB assinado para a Play Store e um APK de teste.
# Manual (Run workflow). Não mexe na VPS nem no deploy do site.
#
# Secrets (Settings → Secrets → Actions), criados pelo dono (docs/APP-MOBILE.md §3):
#   ANDROID_KEYSTORE_BASE64   keystore de upload em base64 (nunca no repositório)
#   ANDROID_KEYSTORE_PASSWORD senha da keystore
#   ANDROID_KEY_ALIAS         alias da chave
#   ANDROID_KEY_PASSWORD      senha da chave
# Sem os secrets, o AAB sai sem assinatura (serve só para conferir o build).
# =============================================================================
name: App Android

on:
  workflow_dispatch:
    inputs:
      versao:
        description: Versão exibida na loja (versionName), ex. 1.0.0
        type: string
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: app-android
  cancel-in-progress: false

jobs:
  android:
    name: Build Android (AAB + APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION_NAME: ${{ inputs.versao }}
      # versionCode cresce a cada execução (a Play Store exige número sempre maior).
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build web (modo app) e cap sync
        run: pnpm --filter @fuse/mobile sync:android

      - name: Keystore de upload
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning title=Sem assinatura::ANDROID_KEYSTORE_BASE64 ausente: o AAB não será aceito pela Play Store."
          fi

      - name: Gradle (bundleRelease + assembleDebug)
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleDebug --no-daemon --stacktrace

      - name: Apagar a keystore do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: fuse-aprova-android-${{ inputs.versao }}-${{ github.run_number }}
          path: |
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
