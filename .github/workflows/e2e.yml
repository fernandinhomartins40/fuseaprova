# =============================================================================
# Fuse Aprova: testes fim a fim (Playwright, Chromium)
#
# Roda `pnpm e2e` (pacote e2e/): sobe a API real com PGlite em memória e
# Asaas falso, faz o build da PWA e o `vite preview`, e percorre cadastro +
# Pix (webhook simulado), lição, revisão, simulado, admin e o visual das telas.
# Não usa secret nem a VPS.
# =============================================================================
name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuseaprova-e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: America/Sao_Paulo
  CI: "1"

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Navegador na versão do @playwright/test do pacote e2e (com as libs do
      # sistema). O `--filter` garante o binário do próprio pacote e2e.
      - name: Instalar o Chromium do Playwright
        run: pnpm --filter @fuse/e2e exec playwright install --with-deps chromium

      - name: pnpm e2e
        run: pnpm e2e

      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
